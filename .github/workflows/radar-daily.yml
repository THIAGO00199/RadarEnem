name: Radar public sources — Python
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-daily
  cancel-in-progress: false
jobs:
  validate-and-publish:
    uses: ./.github/workflows/quality.yml
    with:
      refresh_sources: true
